# Database-triggered inbound alerts authenticate with x-inbox-secret in the handler.
# A gateway JWT check blocks pg_net before that authentication can run.
[functions.inbox-push]
verify_jwt = false

# The handler verifies the signed-in inbox owner with auth.getUser.
[functions.inbox-email-forward]
verify_jwt = false

# The handler verifies the signed-in inbox owner with auth.getUser.
[functions.inbox-dm-draft]
verify_jwt = false

# The list call verifies the signed-in inbox owner with auth.getUser. The file link is opened by the
# phone's own viewer with no session, so it carries its own signature, checked in the handler.
[functions.inbox-dm-attachments]
verify_jwt = false

# The handler verifies the signed-in inbox owner with auth.getUser.
[functions.inbox-calendar]
verify_jwt = false

# Called by the swishdm_lm_requests insert trigger and its retry sweep (pg_net); the handler checks x-inbox-secret.
[functions.swishdm-report-check]
verify_jwt = false

# The handler verifies the signed-in inbox owner with auth.getUser.
[functions.inbox-email-stats]
verify_jwt = false

# Called by content_card_pick (pg_net) once a day for the post card's question; the handler checks x-inbox-secret.
[functions.content-card-ask]
verify_jwt = false

# The handler verifies the signed-in inbox owner with auth.getUser.
[functions.content-card-weave]
verify_jwt = false

[functions.content-stranger-read]
verify_jwt = false

# Content Desk: the handler verifies the signed-in inbox owner with auth.getUser; the
# trigger tick (pg_cron) authenticates with x-desk-secret in the handler.
[functions.content-desk]
verify_jwt = false

[functions.inbox-dm-draft-file]
verify_jwt = false
