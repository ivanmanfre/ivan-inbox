<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- iOS standalone. The manifest already declares display:standalone and
         Safari honours it for the icon and the launch, but the STATUS BAR is
         still driven by these two on iOS: without them the installed app keeps
         a light status bar over a black UI, and black-translucent is what lets
         the layout run under it (the viewport is already viewport-fit=cover,
         and the voice dock pays env(safe-area-inset-bottom) for the home
         indicator). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inbox" />
    <title>Inbox</title>
    <style>html,body{background:#000000}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
